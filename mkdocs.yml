site_name: TaskTide Documentation
site_description: Java Workflow Orchestration Engine for Data Application deployments
site_author: Brendan Kenna

site_url:  https://docs.tasktide.org
repo_url:  https://github.tasktide.org
repo_name: BrenKenna/TaskTide
edit_uri:  edit/main/
docs_dir:  docs


copyright: >
  TaskTide — Backend-agnostic workflow orchestration engine


extra_css:
  - stylesheets/extra.css


extra:
  generator: false
  
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/BrenKenna/TaskTide
      name: TaskTide on GitHub

    - icon: fontawesome/brands/docker
      link: https://hub.docker.com/r/bkenna/tasktide
      name: TaskTide on Docker

    - icon: fontawesome/brands/java
      link: https://api-docs.tasktide.org
      name: TaskTide Java API Documentation
    
    - icon: fontawesome/solid/heart
      link: https://github.com/sponsors/BrenKenna
      name: Sponsor TaskTide
    
    - icon: < WANNA REFERENCE EMOJI >
      link: https://use-cases.tasktide.org
      name: TaskTide Use Cases


theme:
  name: material
  custom_dir: overrides

  favicon: assets/logo1.jpg
  logo: assets/logo1.jpg
  
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

  icon:
    repo:         fontawesome/brands/github
    water-wave:   twemoji/water-wave

  language: en


markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist
  - pymdownx.tilde
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      options:
        custom_icons:
          - overrides/.icons



plugins:
  - search


nav:
  - 1). Home:                                         README.md

  - 2). General:
    - a). Installation:                               general/INSTALL.md
    - b). Database Configuration:                     Database-Configuration.md
    - c). Testing:                                    general/TESTING.md
    - d). Release Template:                           RELEASE.md
    - e). Reporting Vulnerability:                    SECURITY.md
    - f). Feature Request/Issues Template:            ISSUES.md
    - g). Contributing:                               CONTRIBUTING.md

  - 3). Modules:
      - a). TaskTide:                                 tasktide/README.md
      - b). Mutex:                                    tasktide/mutex/README.md
      - c). Item Store:                               tasktide/itemstore/README.md
      - d). Core:                                     tasktide/core/README.md
      - e). Engine:                                   tasktide/engine/README.md
      - f). Web API:                                  tasktide/api/README.md
      - g). Parser:                                   tasktide/parser/README.md
      - h). Command-Line Client:                      tasktide/tasktide/README.md

  - 4). Use Cases:                                    tasktide/use-cases.md

  - 5). API Reference:
      - a). JavaDoc:                                  https://api.docs.tasktide.org

  - 6). Changelog:
      - a). v1.0.0:                                   https://github.tasktide.org/blob/main/CHANGELOG.adoc